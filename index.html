<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital TV Clock</title>
    <!--
        URL settings (combine with &):
          ?24h                 24-hour time
          ?seconds=off         hide seconds
          ?date=off            hide the date
          ?theme=red           red (default), cyan, amber, green, white
          ?weather=off         hide the temperature
          ?units=c             Celsius (default is Fahrenheit)
          ?lat=40.9&lon=-74.0  weather location (default: Teaneck, NJ 07666)
        Example: http://tower:8043/?24h&seconds=off&theme=amber
    -->
    <style>
        :root {
            --accent: #ff3b3b;
            --accent-glow: rgba(255, 59, 59, 0.25);
            --date: #a36a6a;
        }

        /* Eliminates scrollbars and sets a deep, low-glare background */
        html, body {
            background-color: #0b0c10;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            color: var(--date);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none;
        }

        .clock-container {
            text-align: center;
            user-select: none;
            /* Slow drift for burn-in protection */
            transition: transform 20s ease-in-out;
        }

        /* Giant numerical readout */
        .time-display {
            font-size: 16vw;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            /* Equal-width digits so the time doesn't wobble each second */
            font-variant-numeric: tabular-nums;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
            white-space: nowrap;
        }

        .no-seconds .time-display {
            font-size: 22vw;
        }

        /* Smaller AM/PM indicator next to the numbers */
        .ampm-display {
            font-size: 0.25em;
            font-weight: 400;
            margin-left: 0.15em;
            letter-spacing: 0;
        }

        /* Secondary date line below the clock */
        .date-display {
            font-size: 3.5vw;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-top: 2vh;
            text-transform: uppercase;
        }

        /* Current temperature and condition, under the date */
        .weather-display {
            font-size: 3.5vw;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-top: 1.5vh;
            font-variant-numeric: tabular-nums;
            min-height: 1.2em; /* hold the space so the clock doesn't jump when it loads */
        }

        .weather-temp {
            color: var(--accent);
            font-weight: 400;
            margin-right: 0.6em;
        }
    </style>
</head>
<body>

    <div class="clock-container" id="clockWrapper">
        <div class="time-display">
            <span id="time">--:--</span><span id="ampm" class="ampm-display"></span>
        </div>
        <div id="date" class="date-display"></div>
        <div id="weather" class="weather-display"></div>
    </div>

    <script>
        // --- SETTINGS FROM URL ---
        const params = new URLSearchParams(location.search);
        const isOff = (name) => ['off', 'false', '0', 'no'].includes((params.get(name) || '').toLowerCase());
        const settings = {
            use24h: params.has('24h') && !isOff('24h'),
            showSeconds: !isOff('seconds'),
            showDate: !isOff('date'),
            theme: (params.get('theme') || 'red').toLowerCase(),
            showWeather: !isOff('weather'),
            // Default location: Teaneck, NJ (ZIP 07666)
            lat: parseFloat(params.get('lat')) || 40.8976,
            lon: parseFloat(params.get('lon')) || -74.0160,
            celsius: (params.get('units') || '').toLowerCase().startsWith('c'),
        };

        const themes = {
            cyan:  { accent: '#66fcf1', glow: 'rgba(102, 252, 241, 0.2)', date: '#7f9aa3' },
            red:   { accent: '#ff3b3b', glow: 'rgba(255, 59, 59, 0.25)',  date: '#a36a6a' },
            amber: { accent: '#ffb000', glow: 'rgba(255, 176, 0, 0.2)',   date: '#a38a5a' },
            green: { accent: '#39ff6a', glow: 'rgba(57, 255, 106, 0.2)',  date: '#6fa37f' },
            white: { accent: '#f2f2f2', glow: 'rgba(242, 242, 242, 0.15)', date: '#9a9a9a' },
        };
        const theme = themes[settings.theme] || themes.red;
        const rootStyle = document.documentElement.style;
        rootStyle.setProperty('--accent', theme.accent);
        rootStyle.setProperty('--accent-glow', theme.glow);
        rootStyle.setProperty('--date', theme.date);

        if (!settings.showSeconds) document.body.classList.add('no-seconds');

        const timeEl = document.getElementById('time');
        const ampmEl = document.getElementById('ampm');
        const dateEl = document.getElementById('date');
        if (!settings.showDate) dateEl.style.display = 'none';

        // --- CLOCK ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            if (settings.use24h) {
                hours = String(hours).padStart(2, '0');
                ampmEl.textContent = '';
            } else {
                ampmEl.textContent = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
            }

            timeEl.textContent = settings.showSeconds
                ? `${hours}:${minutes}:${seconds}`
                : `${hours}:${minutes}`;

            dateEl.textContent = now.toLocaleDateString('en-US',
                { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Schedule each update just after the next second starts, so the
        // display changes in step with the real clock instead of drifting.
        function tick() {
            updateClock();
            setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
        }

        // --- WEATHER ---
        // Current conditions from Open-Meteo (free, no API key).
        const weatherEl = document.getElementById('weather');
        if (!settings.showWeather) weatherEl.style.display = 'none';

        // WMO weather codes -> short labels
        function describeWeather(code) {
            if (code === 0) return 'Clear';
            if (code === 1) return 'Mostly Clear';
            if (code === 2) return 'Partly Cloudy';
            if (code === 3) return 'Cloudy';
            if (code === 45 || code === 48) return 'Fog';
            if (code >= 51 && code <= 57) return 'Drizzle';
            if (code >= 61 && code <= 67) return 'Rain';
            if (code >= 71 && code <= 77) return 'Snow';
            if (code >= 80 && code <= 82) return 'Showers';
            if (code === 85 || code === 86) return 'Snow Showers';
            if (code >= 95) return 'Thunderstorm';
            return '';
        }

        let lastWeatherAt = 0;
        async function updateWeather() {
            const url = 'https://api.open-meteo.com/v1/forecast'
                + `?latitude=${settings.lat}&longitude=${settings.lon}`
                + '&current=temperature_2m,weather_code'
                + `&temperature_unit=${settings.celsius ? 'celsius' : 'fahrenheit'}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(res.status);
                const { current } = await res.json();
                const temp = Math.round(current.temperature_2m);
                const unit = settings.celsius ? 'C' : 'F';

                weatherEl.textContent = '';
                const tempEl = document.createElement('span');
                tempEl.className = 'weather-temp';
                tempEl.textContent = `${temp}°${unit}`;
                weatherEl.append(tempEl, describeWeather(current.weather_code));
                lastWeatherAt = Date.now();
            } catch (e) {
                // Keep showing the last reading, but clear it once it's over an hour old
                if (Date.now() - lastWeatherAt > 3600000) weatherEl.textContent = '';
            }
        }

        // --- SCREEN PROTECTOR (ANTI-BURN-IN) ---
        // Every minute, drift the clock to a new spot within a few percent of
        // the screen so no pixels show the same thing for hours.
        const wrapper = document.getElementById('clockWrapper');
        function preventBurnIn() {
            const maxX = window.innerWidth * 0.04;
            const maxY = window.innerHeight * 0.06;
            const x = Math.round((Math.random() * 2 - 1) * maxX);
            const y = Math.round((Math.random() * 2 - 1) * maxY);
            wrapper.style.transform = `translate(${x}px, ${y}px)`;
        }

        // --- KEEP THE SCREEN AWAKE ---
        // Only works on HTTPS or localhost; elsewhere the browser ignores it.
        let wakeLock = null;
        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (e) { /* not allowed here; ignore */ }
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        tick();
        setInterval(preventBurnIn, 60000);
        if (settings.showWeather) {
            updateWeather();
            setInterval(updateWeather, 10 * 60000);   // refresh every 10 minutes
        }
        requestWakeLock();
    </script>
</body>
</html>
