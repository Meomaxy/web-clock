<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        /* Eliminates scrollbars and sets a deep, low-glare background */
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 0.5s ease; /* Smooth transition for anti-burn-in shifting */
        }

        /* Container that scales perfectly with the viewport width */
        .clock-container {
            text-align: center;
            user-select: none;
        }

        /* Giant numerical readout */
        .time-display {
            font-size: 16vw; 
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #66fcf1; /* Crisp, readable cyan glow effect */
            text-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
        }

        /* Smaller AM/PM indicator next to the numbers */
        .ampm-display {
            font-size: 4vw;
            font-weight: 400;
            margin-left: 1vw;
            text-transform: uppercase;
            color: #45f3ff;
        }

        /* Secondary date line below the clock */
        .date-display {
            font-size: 3.5vw;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-top: 2vh;
            color: #1f2833;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="clock-container" id="clockWrapper">
        <div class="time-display">
            <span id="time">00:00:00</span><span id="ampm">--</span>
        </div>
        <div id="date" class="date-display">Loading Date...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // --- TIME SECTOR ---
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            // Determine AM/PM marker
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            // Convert to standard 12-hour format (Change to standard hours if 24h preferred)
            hours = hours % 12;
            hours = hours ? hours : 12; // The hour '0' should be '12'
            
            // Padding strings to always preserve 2-digit format
            hours = String(hours).padStart(2, '0');
            minutes = String(minutes).padStart(2, '0');
            seconds = String(seconds).padStart(2, '0');
            
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;

            // --- DATE SECTOR ---
            const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        // --- SCREEN PROTECTOR (ANTI-BURN-IN) ---
        // Gently shifts the layout coordinate slightly every 5 minutes 
        // to prevent ghosting or static display pixel burn-in.
        function preventBurnIn() {
            const maxShiftPixels = 6; 
            const randomX = Math.floor(Math.random() * (maxShiftPixels * 2 + 1)) - maxShiftPixels;
            const randomY = Math.floor(Math.random() * (maxShiftPixels * 2 + 1)) - maxShiftPixels;
            
            document.body.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // Initialize loops
        updateClock();
        setInterval(updateClock, 1000);       // Update values every second
        setInterval(preventBurnIn, 300000);   // Jitter alignment coordinates every 5 minutes
    </script>
</body>
</html>
