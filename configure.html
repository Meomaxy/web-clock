<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Settings</title>
    <!--
        Builds the URL for the clock page (index.html). Only settings that differ
        from the clock's defaults are added to the URL. Opening this page with a
        clock URL's query string (configure.html?theme=amber&24h) pre-fills the controls.
        Location lookup uses the Open-Meteo geocoding API (free, no API key).
    -->
    <style>
        :root {
            --accent: #ff3b3b;
            --bg: #0b0c10;
            --panel: #14161c;
            --line: #2a2e38;
            --text: #e8e8e8;
            --muted: #98a0ac;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.4;
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        h1 { margin: 0 0 4px; font-size: 1.6rem; color: var(--accent); }
        .lede { margin: 0 0 20px; color: var(--muted); }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 4px 16px;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }
        .row:last-child { border-bottom: 0; }
        .row .label { font-weight: 600; }
        .row .hint { display: block; font-weight: 400; font-size: 0.85rem; color: var(--muted); }

        /* Toggle switches: real checkboxes, restyled */
        .switch {
            appearance: none;
            -webkit-appearance: none;
            flex: none;
            width: 52px;
            height: 30px;
            border-radius: 15px;
            background: #3a3f4b;
            position: relative;
            cursor: pointer;
            transition: background 0.15s;
            margin: 0;
        }
        .switch::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s;
        }
        .switch:checked { background: var(--accent); }
        .switch:checked::after { transform: translateX(22px); }
        .switch:disabled { opacity: 0.4; cursor: not-allowed; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Theme swatches and the units picker are radio groups */
        .choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
        .choice input { position: absolute; opacity: 0; pointer-events: none; }
        .choice span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
        }
        .choice input:checked + span { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
        .choice input:disabled + span { opacity: 0.4; cursor: not-allowed; }
        .dot { width: 14px; height: 14px; border-radius: 50%; }

        /* Location lookup */
        .location { padding: 14px 0; border-bottom: 1px solid var(--line); }
        .location:last-child { border-bottom: 0; }
        .location[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
        .search { display: flex; gap: 8px; margin-top: 10px; }
        input[type="search"], input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }
        button, .btn {
            font: inherit;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #20232c;
            color: var(--text);
            cursor: pointer;
            text-decoration: none;
        }
        button:hover, .btn:hover { border-color: var(--accent); }
        .current { margin: 0; }
        .current small { color: var(--muted); }
        .status { min-height: 1.4em; margin: 8px 0 0; font-size: 0.9rem; color: var(--muted); }
        .results { list-style: none; margin: 8px 0 0; padding: 0; }
        .results button { width: 100%; text-align: left; margin-top: 6px; }
        .results small { color: var(--muted); }

        /* Result: link, URL, preview */
        .go {
            display: block;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 14px;
            background: var(--accent);
            border-color: var(--accent);
            color: #0b0c10;
            margin-bottom: 14px;
        }
        .go:hover { filter: brightness(1.1); }
        .url { display: flex; gap: 8px; margin-bottom: 20px; }
        .url input { font-family: Consolas, monospace; font-size: 0.85rem; }

        h2 { font-size: 1rem; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
        .preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--bg);
        }

        @media (max-width: 480px) {
            .row { flex-wrap: wrap; }
            .choices { justify-content: flex-start; }
        }
    </style>
</head>
<body>
<main>
    <h1>Clock Settings</h1>
    <p class="lede">Choose how the clock looks, then open it with the link below.</p>

    <section class="panel" aria-label="Display">
        <div class="row">
            <label for="h24"><span class="label">24-hour time</span><span class="hint">Off shows 12-hour time with AM/PM</span></label>
            <input class="switch" type="checkbox" role="switch" id="h24">
        </div>
        <div class="row">
            <label for="seconds"><span class="label">Show seconds</span></label>
            <input class="switch" type="checkbox" role="switch" id="seconds">
        </div>
        <div class="row">
            <label for="date"><span class="label">Show date</span></label>
            <input class="switch" type="checkbox" role="switch" id="date">
        </div>
        <div class="row">
            <span class="label" id="theme-label">Color</span>
            <div class="choices" role="radiogroup" aria-labelledby="theme-label" id="themes"></div>
        </div>
    </section>

    <section class="panel" aria-label="Weather">
        <div class="row">
            <label for="weather"><span class="label">Show weather</span><span class="hint">Temperature, condition and chance of precipitation</span></label>
            <input class="switch" type="checkbox" role="switch" id="weather">
        </div>
        <div class="row" id="units-row">
            <span class="label" id="units-label">Temperature units</span>
            <div class="choices" role="radiogroup" aria-labelledby="units-label">
                <label class="choice"><input type="radio" name="units" value="f"><span>Fahrenheit</span></label>
                <label class="choice"><input type="radio" name="units" value="c"><span>Celsius</span></label>
            </div>
        </div>
        <div class="location" id="location">
            <p class="current"><span class="label" style="font-weight:600">Location</span><br>
                <span id="loc-name"></span> <small id="loc-coords"></small></p>
            <form class="search" id="search-form" role="search">
                <input type="search" id="query" placeholder="City or ZIP code" aria-label="Search for a location" autocomplete="off">
                <button type="submit">Search</button>
            </form>
            <p class="status" id="status" role="status" aria-live="polite"></p>
            <ul class="results" id="results"></ul>
            <button type="button" id="reset-loc">Use the default location</button>
        </div>
    </section>

    <a class="btn go" id="go" href="index.html">Open the clock &rarr;</a>
    <div class="url">
        <input type="text" id="url" readonly aria-label="Clock URL">
        <button type="button" id="copy">Copy</button>
    </div>

    <h2>Preview</h2>
    <iframe class="preview" id="preview" title="Clock preview"></iframe>
</main>

<script>
    // Same names, values and defaults as the clock page (index.html)
    const THEMES = {
        red: '#ff3b3b', cyan: '#66fcf1', amber: '#ffb000', green: '#39ff6a', white: '#f2f2f2',
    };
    const DEFAULT_LOC = { lat: 40.8976, lon: -74.0160, name: 'Teaneck, NJ 07666' };

    const state = {
        h24: false, seconds: true, date: true, weather: true,
        theme: 'red', celsius: false, loc: { ...DEFAULT_LOC },
    };

    // --- Start from the query string, if there is one ---
    (function readQuery() {
        const p = new URLSearchParams(location.search);
        const isOff = (n) => ['off', 'false', '0', 'no'].includes((p.get(n) || '').toLowerCase());
        state.h24 = p.has('24h') && !isOff('24h');
        state.seconds = !isOff('seconds');
        state.date = !isOff('date');
        state.weather = !isOff('weather');
        const theme = (p.get('theme') || '').toLowerCase();
        if (THEMES[theme]) state.theme = theme;
        state.celsius = (p.get('units') || '').toLowerCase().startsWith('c');
        const lat = parseFloat(p.get('lat')), lon = parseFloat(p.get('lon'));
        if (isFinite(lat) && isFinite(lon)) {
            state.loc = { lat, lon, name: 'Custom location' };
        }
    })();

    const $ = (id) => document.getElementById(id);
    const isDefaultLoc = () =>
        Math.abs(state.loc.lat - DEFAULT_LOC.lat) < 1e-4 && Math.abs(state.loc.lon - DEFAULT_LOC.lon) < 1e-4;

    // --- Build the clock URL, adding only what differs from the defaults ---
    function clockUrl() {
        const parts = [];
        if (state.h24) parts.push('24h');
        if (!state.seconds) parts.push('seconds=off');
        if (!state.date) parts.push('date=off');
        if (state.theme !== 'red') parts.push('theme=' + state.theme);
        if (!state.weather) {
            parts.push('weather=off');
        } else {
            if (state.celsius) parts.push('units=c');
            if (!isDefaultLoc()) {
                parts.push('lat=' + +state.loc.lat.toFixed(4), 'lon=' + +state.loc.lon.toFixed(4));
            }
        }
        // Next to this page. A file:// page needs the file name; a server can serve the folder.
        const base = new URL(location.protocol === 'file:' ? 'index.html' : './', location.href).href;
        return base + (parts.length ? '?' + parts.join('&') : '');
    }

    // --- Controls ---
    const themesEl = $('themes');
    for (const [name, color] of Object.entries(THEMES)) {
        const label = document.createElement('label');
        label.className = 'choice';
        label.innerHTML = '<input type="radio" name="theme"><span><i class="dot"></i></span>';
        const input = label.querySelector('input');
        input.value = name;
        label.querySelector('.dot').style.background = color;
        label.querySelector('span').append(name[0].toUpperCase() + name.slice(1));
        themesEl.append(label);
    }

    for (const key of ['h24', 'seconds', 'date', 'weather']) {
        $(key).addEventListener('change', (e) => { state[key] = e.target.checked; render(); });
    }
    document.addEventListener('change', (e) => {
        if (e.target.name === 'theme') { state.theme = e.target.value; render(); }
        if (e.target.name === 'units') { state.celsius = e.target.value === 'c'; render(); }
    });

    // --- Location lookup ---
    let searchId = 0;
    const statusEl = $('status'), resultsEl = $('results');

    function placeName(r) {
        return [r.name, r.admin1, r.country].filter(Boolean).join(', ');
    }

    $('search-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = $('query').value.trim();
        resultsEl.textContent = '';
        if (q.length < 2) { statusEl.textContent = 'Type at least 2 characters.'; return; }
        const id = ++searchId;
        statusEl.textContent = 'Searching…';
        try {
            const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&format=json&name='
                + encodeURIComponent(q));
            if (!res.ok) throw new Error(res.status);
            const { results = [] } = await res.json();
            if (id !== searchId) return;   // a newer search replaced this one
            statusEl.textContent = results.length ? 'Choose a place:' : 'No places found.';
            for (const r of results) {
                const li = document.createElement('li');
                const b = document.createElement('button');
                b.type = 'button';
                b.append(placeName(r));
                if (r.postcodes?.length) {
                    const s = document.createElement('small');
                    s.textContent = '  ' + r.postcodes[0];
                    b.append(s);
                }
                b.addEventListener('click', () => {
                    state.loc = { lat: r.latitude, lon: r.longitude, name: placeName(r) };
                    resultsEl.textContent = '';
                    statusEl.textContent = '';
                    $('query').value = '';
                    render();
                });
                li.append(b);
                resultsEl.append(li);
            }
        } catch (err) {
            if (id === searchId) statusEl.textContent = 'The lookup failed. Check your connection and try again.';
        }
    });

    $('reset-loc').addEventListener('click', () => {
        state.loc = { ...DEFAULT_LOC };
        resultsEl.textContent = '';
        statusEl.textContent = '';
        render();
    });

    // --- Copy ---
    $('copy').addEventListener('click', async () => {
        const input = $('url');
        input.select();
        try { await navigator.clipboard.writeText(input.value); }
        catch (e) { document.execCommand('copy'); }   // plain-HTTP pages have no clipboard API
        $('copy').textContent = 'Copied';
        setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500);
    });

    // --- Draw everything from `state` ---
    let previewTimer;
    function render() {
        for (const key of ['h24', 'seconds', 'date', 'weather']) $(key).checked = state[key];
        for (const input of document.querySelectorAll('input[name="theme"]')) input.checked = input.value === state.theme;
        for (const input of document.querySelectorAll('input[name="units"]')) {
            input.checked = input.value === (state.celsius ? 'c' : 'f');
            input.disabled = !state.weather;
        }
        $('location').setAttribute('aria-disabled', String(!state.weather));
        for (const el of $('location').querySelectorAll('input, button')) el.disabled = !state.weather;

        $('loc-name').textContent = isDefaultLoc() ? DEFAULT_LOC.name + ' (default)' : state.loc.name;
        $('loc-coords').textContent = `${state.loc.lat.toFixed(4)}, ${state.loc.lon.toFixed(4)}`;
        $('reset-loc').hidden = isDefaultLoc();

        document.documentElement.style.setProperty('--accent', THEMES[state.theme]);

        const url = clockUrl();
        $('url').value = url;
        $('go').href = url;
        // Wait a moment so rapid changes don't reload the preview (and the weather lookup) each time
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
            if ($('preview').getAttribute('src') !== url) $('preview').src = url;
        }, 300);
    }

    render();
</script>
</body>
</html>
